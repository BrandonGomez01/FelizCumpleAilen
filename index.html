<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Ailen</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;color:#fff;background:linear-gradient(180deg,#050516 0%,#0a0a1a 100%);transition:background 3s;overflow:hidden}
body.dawn{background:linear-gradient(180deg,#ff7e5f 0%,#feb47b 20%,#1a1a3a 70%,#0a0a1a 100%)}
.scene{width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;align-items:center;z-index:20;position:relative}
.hint{font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-bottom:30px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.envelope{position:relative;width:320px;height:200px;cursor:pointer}
.env-back{position:absolute;width:100%;height:100%;background:#f7e6c7;border-radius:0 0 12px 12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.env-flap{position:absolute;top:0;width:0;height:0;border-left:160px solid transparent;border-right:160px solid transparent;border-top:110px solid #ff8fab;transform-origin:top;transition:.8s;z-index:3}
.envelope.open .env-flap{transform:rotateX(180deg)}
.letter{position:absolute;bottom:10px;left:12px;right:12px;height:175px;background:white;border-radius:8px;transition:.8s .4s;z-index:2;display:flex;justify-content:center;align-items:center;color:#333}
.envelope.open .letter{transform:translateY(-140px);height:300px}
.letter-inner{opacity:0;transition:.6s .9s;text-align:center}
.envelope.open .letter-inner{opacity:1}
.content{display:none;min-height:100vh;width:100%;position:relative;overflow:auto}
.content.show{display:block}
.stars{position:fixed;inset:0;z-index:0}
.center{position:relative;z-index:5;max-width:600px;margin:0 auto;padding:40px 24px;text-align:center}
.title{font-family:'Dancing Script',cursive;font-size:52px;margin:20px 0 8px}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:32px;margin:24px 0;overflow:hidden}
/* ESTA ES LA TARJETA DEL CORAZON CON FONDO DISTINTO */
.card.heart-card{background:#fffef9;border:1px solid #ffe0e8;box-shadow:0 20px 60px rgba(255,105,140,.2), inset 0 0 80px rgba(255,230,240,.8);}
.heart-wrap{width:100%;max-width:380px;height:380px;margin:10px auto;position:relative;background:radial-gradient(ellipse at center,#fff 0%, #fff5f7 55%, #ffe4ea 100%);border-radius:24px;box-shadow:inset 0 0 40px rgba(255,182,193,.3)}
#heartCanvas{position:absolute;inset:0;width:100%;height:100%;}
.heart-word{position:absolute;font-family:'Dancing Script',cursive;color:#ff6b8a;opacity:0;transform:translate(-50%,-50%) scale(0);white-space:nowrap;font-weight:600;text-shadow:none;transition:all .5s cubic-bezier(.34,1.56,.64,1);font-size:14px;letter-spacing:0.3px}
.heart-word.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.heart-name{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(0);font-family:'Dancing Script',cursive;font-size:56px;font-weight:700;color:#ff2e6b;opacity:0;text-shadow:0 2px 0 #fff, 0 0 20px rgba(255,46,107,.4);transition:all .9s cubic-bezier(.34,1.56,.64,1);z-index:10;white-space:nowrap}
.heart-name.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.letter-text{font-family:'Dancing Script',cursive;font-size:24px;line-height:1.7;color:#f0e6ff;text-align:left;min-height:200px;white-space:pre-line}
.btn{background:white;color:#0a0a1a;border:none;padding:14px 32px;border-radius:100px;font-weight:700;cursor:pointer;margin-top:18px}
.balloon{position:fixed;bottom:-150px;z-index:2;animation:floatUp linear forwards;pointer-events:none}
@keyframes floatUp{to{transform:translateY(-120vh);opacity:0}}
.cake-section{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:20px}
.cake-stage{position:relative;width:220px;height:120px;display:flex;justify-content:center;align-items:flex-end;}
.cake{width:220px;height:90px;background:linear-gradient(#ffbe0b,#ff8fab);border-radius:12px 12px 20px 20px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cake::before{content:'';position:absolute;top:-22px;left:10px;right:10px;height:32px;background:#fff;border-radius:20px}
.candles{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:5}
.candle{width:14px;height:42px;background:linear-gradient(#8a64ff,#3a86ff);border-radius:7px;position:relative}
.flame-real{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:18px;height:26px;background:radial-gradient(ellipse at center,#fff 0%,#ffeb3b 35%,#ff9800 65%,#ff3d00 100%);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;animation:flickerReal .14s infinite alternate;box-shadow:0 0 12px #ff9800,0 0 22px #ff6b00;cursor:pointer}
@keyframes flickerReal{0%{transform:translateX(-50%) scaleY(1) scaleX(1)}100%{transform:translateX(-50%) scaleY(1.18) scaleX(0.92)}}
.flame-real.off{opacity:0;transform:translateX(-50%) scale(0);transition:.5s}
.spark{position:absolute;width:2px;height:2px;background:#ffeb3b;border-radius:50%;pointer-events:none;animation:sparkUp .7s ease-out forwards}
@keyframes sparkUp{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.heart-wrap.beating{animation:heartBeat 1.3s ease-in-out infinite}
</style>
</head>
<body id="body">
<div id="balloon-container" style="position:fixed;inset:0;pointer-events:none;z-index:1"></div>
<canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:50"></canvas>
<div class="scene" id="scene">
  <div class="hint">Toca para abrir ✨</div>
  <div class="envelope" id="envelope" onclick="openLetter()"><div class="env-back"></div><div class="letter"><div class="letter-inner">💌<p style="margin-top:8px;font-weight:600">PARA AILEN</p></div></div><div class="env-flap"></div></div>
</div>
<div class="content" id="content">
  <canvas id="starsBg" class="stars"></canvas>
  <div class="center">
    <h1 class="title">Feliz cumpleaños Ailen</h1>
    <p style="opacity:.6;letter-spacing:2px;font-size:12px;margin-bottom:20px">EN TODOS LOS IDIOMAS, SOLO PARA VOS</p>
    
    <div class="card heart-card">
      <p style="font-size:11px;letter-spacing:2px;opacity:.5;margin-bottom:8px;text-transform:uppercase;color:#ff6b8a">UN CORAZÓN HECHO DE DESEOS</p>
      <div class="heart-wrap" id="heartWrap">
        <canvas id="heartCanvas" width="380" height="380"></canvas>
        <div class="heart-name" id="heartName">Ailen</div>
      </div>
      <p style="font-size:14px;margin-top:12px;line-height:1.4;color:#ff6b8a">En cada idioma del mundo,<br><span style="opacity:.6;font-size:13px;color:#b36;">todos celebran que existís.</span></p>
    </div>

    <div class="card"><p class="letter-text" id="typed"></p></div>
    <div class="card">
      <h3 style="font-family:'Dancing Script',cursive;font-size:30px;margin-bottom:8px">Pedí un deseo, Ailen 🎂</h3>
      <p style="font-size:13px;opacity:.7" id="blowHint">✨ Tocá las velitas para pedir tu deseo ✨</p>
      <div class="cake-section">
        <div class="cake-stage">
          <div class="candles" id="candles">
            <div class="candle"><div class="flame-real"></div></div>
            <div class="candle"><div class="flame-real"></div></div>
            <div class="candle"><div class="flame-real"></div></div>
            <div class="candle"><div class="flame-real"></div></div>
            <div class="candle"><div class="flame-real"></div></div>
          </div>
          <div class="cake"></div>
        </div>
        <button class="btn" id="wishBtn" style="display:none" onclick="celebrate()">¡Que se cumpla, Ailen! ✨</button>
      </div>
    </div>
    <button class="btn" onclick="moreBalloons()">MÁS GLOBOS 🎈</button>
  </div>
</div>
<script>
const colors=['#ff8fab','#ff6b8a','#8a64ff','#ffbe0b','#06d6a0','#ff006e','#3a86ff'];
function createBalloon(r=false){const c=document.getElementById('balloon-container');const b=document.createElement('div');b.className='balloon';const col=colors[Math.floor(Math.random()*colors.length)];const s=36+Math.random()*42;b.style.left=Math.random()*100+'vw';b.style.animationDuration=(8+Math.random()*8)+'s';b.style.animationDelay=(r?Math.random()*5:0)+'s';b.innerHTML=`<div style="width:${s}px;height:${s*1.25}px;background:${col};border-radius:50% 50% 50% 50% / 60% 60% 40% 40%"></div><div style="width:1px;height:50px;background:rgba(255,255,255,.4);margin:0 auto"></div>`;c.appendChild(b);setTimeout(()=>b.remove(),13000);}
function startBalloons(){for(let i=0;i<28;i++)createBalloon(true);setInterval(()=>createBalloon(false),550);}
function moreBalloons(){for(let i=0;i<35;i++)setTimeout(()=>createBalloon(false),i*60);burstConfetti(120);}
function burstConfetti(amount=180){const canvas=document.getElementById('confettiCanvas');const ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;const pieces=[];for(let i=0;i<amount;i++){pieces.push({x:innerWidth/2+(Math.random()-0.5)*200,y:innerHeight/2,vx:(Math.random()-0.5)*14,vy:-Math.random()*14-2,rot:Math.random()*360,vr:(Math.random()-0.5)*12,size:6+Math.random()*8,color:colors[Math.floor(Math.random()*colors.length)]});}let t=0;function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);ctx.restore();});t++;if(t<180)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);}draw();}
function openLetter(){document.getElementById('envelope').classList.add('open');burstConfetti(200);setTimeout(()=>{document.getElementById('scene').style.display='none';document.getElementById('content').classList.add('show');document.getElementById('body').style.overflow='auto';document.getElementById('body').classList.add('dawn');drawStarsBg();buildHeart();startBalloons();startTyping();initCake();setTimeout(()=>burstConfetti(150),800);},1300);}
function drawStarsBg(){const c=document.getElementById('starsBg');const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;for(let i=0;i<220;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.8})`;x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.6,0,Math.PI*2);x.fill();}}
// SOLO 12 FRASES, BIEN SEPARADAS EN CIRCULO CORAZON
const wishes=["Feliz Cumpleaños","Happy Birthday","Joyeux Anniversaire","Buon Compleanno","Feliz Aniversário","Alles Gute","Parabéns","お誕生日おめでとう","생일 축하해","Doğum Günün Kutlu","С Днем Рождения","Grattis"];
function heartPoint(t, scale){const x=16*Math.pow(Math.sin(t),3);const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));return{x:x*scale,y:y*scale};}
function buildHeart(){
  const wrap=document.getElementById('heartWrap');
  const canvas=document.getElementById('heartCanvas');
  const ctx=canvas.getContext('2d');
  const cx=190, cy=210, scale=9.8;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // corazon muy sutil de fondo
  ctx.strokeStyle='rgba(255,107,138,0.18)'; ctx.lineWidth=2; ctx.beginPath();
  for(let t=0;t<Math.PI*2;t+=0.02){const p=heartPoint(t,scale); if(t===0) ctx.moveTo(cx+p.x,cy+p.y); else ctx.lineTo(cx+p.x,cy+p.y);} ctx.closePath(); ctx.stroke();
  
  // 12 posiciones exactas en el borde, separadas 30 grados cada una
  for(let i=0;i<wishes.length;i++){
    const angle=(i/wishes.length)*Math.PI*2 - Math.PI/2; // -90° para empezar arriba
    const p=heartPoint(angle,scale);
    const el=document.createElement('div'); 
    el.className='heart-word';
    el.textContent=wishes[i];
    el.style.left=(cx+p.x)+'px'; 
    el.style.top=(cy+p.y)+'px';
    // alternar color para que se distinga
    el.style.color= i%2===0 ? '#ff2e6b' : '#8a64ff';
    wrap.appendChild(el);
    setTimeout(()=>el.classList.add('show'), i*140);
  }
  setTimeout(()=>{document.getElementById('heartName').classList.add('show'); wrap.classList.add('beating'); burstConfetti(100);}, wishes.length*140+400);
}
const fullText=`Hola Ailen ❤️\n\nSi pudiera decirte feliz cumple en todos los idiomas del mundo, lo haría.\n\nY aun así no alcanzaría para decirte lo mucho que me importas.\n\nGracias por existir,\npor reírte así,\npor iluminar todo como lo hacés.\n\nHoy todo el mundo celebra por vos.\nPedí un deseo bien fuerte,\nque yo me encargo de que se cumpla.\n\nFeliz cumpleaños, Ailen 🎂✨`;
function startTyping(){const el=document.getElementById('typed');let i=0;function type(){if(i<=fullText.length){el.innerHTML=fullText.slice(0,i)+'<span class="typed-cursor">|</span>';i++;setTimeout(type,30+Math.random()*30);}else{el.innerHTML=fullText;}}type();}
function initCake(){
  const flames=document.querySelectorAll('.flame-real'); let blown=0;
  function createSparks(flame){for(let k=0;k<5;k++){const s=document.createElement('div'); s.className='spark'; s.style.left='50%'; s.style.top='0px'; s.style.setProperty('--x',(Math.random()-0.5)*36+'px'); s.style.setProperty('--y',-18-Math.random()*24+'px'); flame.appendChild(s); setTimeout(()=>s.remove(),700);}}
  setInterval(()=>{flames.forEach(f=>{ if(!f.classList.contains('off') && Math.random()>0.6) createSparks(f); });},350);
  function blowOne(fl){if(fl.classList.contains('off'))return; fl.classList.add('off'); blown++; burstConfetti(30); if(blown>=flames.length){document.getElementById('blowHint').textContent='¡Se apagaron! Pedí tu deseo ✨'; document.getElementById('wishBtn').style.display='inline-block'; burstConfetti(200); moreBalloons();}}
  flames.forEach(f=>f.addEventListener('click',()=>blowOne(f)));
}
function celebrate(){burstConfetti(300);moreBalloons();document.getElementById('wishBtn').textContent='¡Deseo concedido, Ailen! 💫';}
for(let i=0;i<12;i++)setTimeout(()=>createBalloon(true),i*280);
</script>
</body>
</html>
