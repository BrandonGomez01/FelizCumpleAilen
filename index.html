<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Inter',sans-serif;color:#fff}
.scene{width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;align-items:center;z-index:10;position:relative}
.hint{font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:30px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.envelope{position:relative;width:320px;height:200px;cursor:pointer}
.env-back{position:absolute;width:100%;height:100%;background:#f7e6c7;border-radius:0 0 12px 12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.env-flap{position:absolute;top:0;width:0;height:0;border-left:160px solid transparent;border-right:160px solid transparent;border-top:110px solid #ff8fab;transform-origin:top;transition:.8s cubic-bezier(.68,-.55,.27,1.55);z-index:3}
.envelope.open .env-flap{transform:rotateX(180deg)}
.letter{position:absolute;bottom:10px;left:12px;right:12px;height:175px;background:white;border-radius:8px;transition:.8s .4s;z-index:2;display:flex;justify-content:center;align-items:center;color:#333}
.envelope.open .letter{transform:translateY(-140px);height:300px}
.letter-inner{opacity:0;transition:.6s .9s;text-align:center}
.envelope.open .letter-inner{opacity:1}
.content{display:none;min-height:100vh;width:100%;position:relative}
.content.show{display:block;animation:fadeIn 1s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stars{position:fixed;inset:0;z-index:0}
.c{position:relative;z-index:5;max-width:600px;margin:0 auto;padding:40px 24px;text-align:center}
.title{font-family:'Dancing Script',cursive;font-size:48px;margin:20px 0}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:32px;margin:24px 0}
canvas.map{width:100%;max-width:340px;height:340px;border-radius:50%;background:radial-gradient(ellipse at center,#1a1a3a,#0a0a1a 70%);margin:20px auto;display:block;box-shadow:0 0 80px rgba(138,100,255,.3)}
.letter-text{font-family:'Dancing Script',cursive;font-size:22px;line-height:1.6;color:#f0e6ff;text-align:left;white-space:pre-line}
.btn{background:white;color:#0a0a1a;border:none;padding:14px 32px;border-radius:100px;font-weight:600;cursor:pointer;margin-top:20px}
.balloon{position:fixed;bottom:-150px;z-index:2;animation:floatUp linear forwards;pointer-events:none}
.balloon-string{width:1px;height:50px;background:rgba(255,255,255,.4);margin:0 auto}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(-120vh) rotate(-3deg);opacity:0}}
</style>
</head>
<body id="body">
<div id="balloon-container" style="position:fixed;inset:0;pointer-events:none;z-index:1"></div>

<div class="scene" id="scene">
  <div class="hint">Toca para abrir ✨</div>
  <div class="envelope" id="envelope" onclick="openLetter()">
    <div class="env-back"></div>
    <div class="letter"><div class="letter-inner">💌<p style="margin-top:12px;font-weight:600">PARA VOS</p></div></div>
    <div class="env-flap"></div>
  </div>
</div>

<div class="content" id="content">
  <canvas id="starsBg" class="stars"></canvas>
  <div class="c">
    <h1 class="title">Feliz cumpleaños</h1>
    <div class="card">
      <canvas id="map" class="map" width="700" height="700"></canvas>
      <p style="font-size:13px;opacity:.6">Así se veían las estrellas el día que naciste</p>
    </div>
    <div class="card">
      <p class="letter-text">Acá va tu mensaje...

Ese día las estrellas se alinearon de una forma que nunca más se repitió.

Gracias por existir ❤️

🎈🎈🎈</p>
    </div>
    <button class="btn" onclick="burstBalloons()">MÁS GLOBOS 🎈</button>
  </div>
</div>

<script>
const colors=['#ff8fab','#8a64ff','#ffbe0b','#06d6a0','#ff006e','#3a86ff'];
function createBalloon(randomStart=false){
  const c=document.getElementById('balloon-container');
  const b=document.createElement('div'); b.className='balloon';
  const color=colors[Math.floor(Math.random()*colors.length)];
  const size=40+Math.random()*40;
  b.style.left=Math.random()*100+'vw';
  b.style.animationDuration=(8+Math.random()*8)+'s';
  b.style.animationDelay=(randomStart?Math.random()*5:0)+'s';
  b.innerHTML=`<div style="width:${size}px;height:${size*1.25}px;background:${color};border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;box-shadow:inset -8px -8px 0 rgba(0,0,0,.15)"></div><div class="balloon-string"></div>`;
  c.appendChild(b);
  setTimeout(()=>b.remove(),13000);
}
function startBalloons(){ for(let i=0;i<25;i++) createBalloon(true); setInterval(()=>createBalloon(false),600); }
function burstBalloons(){ for(let i=0;i<30;i++) setTimeout(()=>createBalloon(false), i*60); }
function openLetter(){
  document.getElementById('envelope').classList.add('open');
  setTimeout(()=>{
    document.getElementById('scene').style.display='none';
    document.getElementById('content').classList.add('show');
    document.getElementById('body').style.background='#0e0e26';
    document.getElementById('body').style.overflow='auto';
    drawStarsBg(); drawMap(); startBalloons();
  },1400);
}
function drawStarsBg(){ const c=document.getElementById('starsBg'); const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; for(let i=0;i<200;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.8})`;x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.5,0,Math.PI*2);x.fill();} }
function drawMap(){ const canvas=document.getElementById('map'); const ctx=canvas.getContext('2d'); const cx=350,cy=350; for(let i=0;i<400;i++){const a=Math.random()*Math.PI*2;const r=Math.random()*300;ctx.fillStyle=`rgba(255,255,255,${0.3+Math.random()*0.7})`;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.random()*1.8,0,Math.PI*2);ctx.fill();} ctx.fillStyle='rgba(255,245,200,0.9)';ctx.beginPath();ctx.arc(cx+180,cy-170,22,0,Math.PI*2);ctx.fill(); }
// globos ya en la intro
for(let i=0;i<12;i++) setTimeout(()=>createBalloon(true), i*300);
</script>
</body>
</html>
